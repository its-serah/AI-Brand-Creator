name: Publish RunPod image to GHCR

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'Dockerfile.runpod.simple'
      - 'runpod_handler.py'
      - '.github/workflows/publish-runpod-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod.simple
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ai-brand-runpod:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

